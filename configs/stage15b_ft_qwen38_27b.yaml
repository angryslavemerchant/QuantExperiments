# Stage 15b: Qwen3.8-27B 2.5 bpw fine-tune fix, the stage 14 learning rate (isolates the data change).
# Stage 14 s14_25's fine-tune barely moved the eval KL (0.1385 -> 0.1357; the 3.0 one got worse).
# Same compression as s14_25 (its allocation from configs/alloc, same calibration / seed: the pre-ft
# row should reproduce KL 0.13847), then a fine-tune on 256 x 2048 FRESH fineweb tokens (after the
# calibration ones; 512 steps of 1024 = one pass), held-out KL every 64 steps on 16 unseen fineweb
# and 16 wikitext-TRAIN sequences, keeping the best books + gains on held-out fineweb.
# Run: python scripts/run_experiment.py --config configs/stage15b_ft_qwen38_27b.yaml
stage: 15
output_dir: artifacts/qwen38_27b/stage15b
model: Qwen/Qwen3.8-27B
reference_dtype: bfloat16
seed: 0

eval:
  logit_chunk: 128
  wikitext:
    dataset: Salesforce/wikitext
    subset: wikitext-2-raw-v1
    split: test
    context: 2048
    num_windows: 49        # 49 x 2,048 = ~100k tokens
  gsm8k: {enabled: false, dataset: openai/gsm8k, subset: main, split: test, num_problems: 4, max_new_tokens: 64, batch_size: 4}
  deploy:
    - {name: h8e4, head: 8, embed: 4}

calibration:
  dataset: HuggingFaceFW/fineweb-edu
  subset: sample-10BT
  split: train
  num_sequences: 128
  context: 2048
  batch_size: 4

allocation:
  d: 4
  Ks: [256, 1024, 4096]
  fisher_sequences: 32     # 32 x 2,048 calibration tokens, as 64 x 1,024
  fisher_seq_len: 1024
  proxy_iters: 10
  proxy_fit_chunks: 250000

kmeans:
  iters: 25
  refit_iters: 10
  max_fit_chunks: 1000000
  assign_batch: 32768

runs:
  - {name: s15b_25, method: stack, d: 4, alloc_file: configs/alloc/qwen38_27b_s14_25.json, G: 4, M: 1, rounds: 2, select_frac: 1.0, ldlq: true, ldlq_damp: 0.1, gsm8k: false, finetune: {steps: 512, seq_len: 1024, lr_books: 1.0e-4, lr_gain: 1.0e-3, log_every: 32, sequences: 256, heldout: {fineweb: 16, wikitext_train: 16}, heldout_every: 64, keep_best: fineweb}}
