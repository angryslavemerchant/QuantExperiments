# Stage 11b: the 3-bpw speed-capped stack (uniform K4096, G4, M1, 512-step finetune; KL 0.096 in s20)
# + LDLQ error feedback. Compare: s5_full_ft 0.080 (K up to 16384, slow), IQ3_XS 0.098 at 3.26 bpw.
# Run: python scripts/run_experiment.py --config configs/stage11b_ldlq_3b_7b.yaml
stage: 11
output_dir: artifacts/qwen_s01/stage11b_ldlq_3b_7b
model: Qwen/Qwen2.5-7B-Instruct
reference_dtype: bfloat16
seed: 0

eval:
  logit_chunk: 256
  wikitext:
    dataset: Salesforce/wikitext
    subset: wikitext-2-raw-v1
    split: test
    context: 2048
    num_windows: 49        # 49 x 2,048 = ~100k tokens
  gsm8k:
    enabled: true
    dataset: openai/gsm8k
    subset: main
    split: test
    num_problems: 200
    max_new_tokens: 512
    batch_size: 50

calibration:
  dataset: HuggingFaceFW/fineweb-edu
  subset: sample-10BT
  split: train
  num_sequences: 128
  context: 2048
  batch_size: 4

kmeans:
  iters: 25
  refit_iters: 10
  max_fit_chunks: 1000000
  assign_batch: 32768

runs:
  - {name: original, method: original, gsm8k: false}
  - {name: s11_u4096_m1_g4_ldlq, method: stack, d: 4, K: 4096, G: 4, M: 1, rounds: 2, select_frac: 1.0, ldlq: true, ldlq_damp: 0.1, gsm8k: false, finetune: {steps: 512, seq_len: 1024, lr_books: 1.0e-4, lr_gain: 1.0e-3, log_every: 32}}
