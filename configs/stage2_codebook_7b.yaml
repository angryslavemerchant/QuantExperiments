# Stage 2: learned codebook, no shuffle, on Qwen2.5-7B-Instruct.
# The d=8, K=65,536 neighbour is dropped (user decision); see README.
stage: 2
output_dir: artifacts/qwen_s01/stage2_codebook_7b
model: Qwen/Qwen2.5-7B-Instruct
reference_dtype: bfloat16
seed: 0

eval:
  logit_chunk: 256
  wikitext:
    dataset: Salesforce/wikitext
    subset: wikitext-2-raw-v1
    split: test
    context: 2048
    num_windows: 49        # 49 x 2,048 = ~100k tokens
  gsm8k:
    enabled: true
    dataset: openai/gsm8k
    subset: main
    split: test
    num_problems: 200
    max_new_tokens: 512
    batch_size: 50

kmeans:
  iters: 25
  max_fit_chunks: 1000000
  assign_batch: 32768      # halved vs 1.5B: 7B weights + fp32 lm_head already use ~17 GB

runs:
  - {name: original, method: original}
  - {name: cb_d8_k4096, method: codebook, d: 8, K: 4096}                 # target, ~1.5 bpw
  - {name: cb_d4_k4096, method: codebook, d: 4, K: 4096}                 # shorter shapes, ~3.0 bpw
  - {name: cb_d8_k6561, method: codebook, d: 8, K: 6561}                 # ternary-equivalent, 1.58 ideal
  - {name: cb_d1_k3, method: codebook, d: 1, K: 3}                       # scalar control
  - {name: cb_d8_k4096_fp16, method: codebook, d: 8, K: 4096, start: fp16}  # Q4-start cost
