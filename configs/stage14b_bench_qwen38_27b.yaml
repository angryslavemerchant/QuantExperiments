# Stage 14b: Qwen3.8-27B benchmark, box b of 3 (run in parallel; same model, eval windows,
# calibration and seed, so the three results.csv files form one table).
#   14a: the 16-bit original + our 2.5 bpw recipe (Fisher allocation over K {256, 1024, 4096} at the
#        uniform-1024 budget, G4 M1, LDLQ, fine-tune 512 steps)
#   14b: our 3.0 bpw recipe (uniform K4096, G4 M1, LDLQ, fine-tune 512 steps)
#   14c: six llama.cpp GGUF references (imatrix), also scored with their own token_embd / output
# KL on ~100k wikitext tokens vs the 16-bit model; block linears only, plus the deployed head /
# embedding formats (ours 8-bit head + 4-bit embedding). Memory: Hessians / Fisher in layer groups
# and the fine-tune's shared teacher keep a 96 GB card enough (run.log records GPU memory per line).
# Run: python scripts/run_experiment.py --config configs/stage14b_bench_qwen38_27b.yaml
stage: 14
output_dir: artifacts/qwen38_27b/stage14b
model: Qwen/Qwen3.8-27B
reference_dtype: bfloat16
seed: 0

eval:
  logit_chunk: 128
  wikitext:
    dataset: Salesforce/wikitext
    subset: wikitext-2-raw-v1
    split: test
    context: 2048
    num_windows: 49        # 49 x 2,048 = ~100k tokens
  gsm8k: {enabled: false, dataset: openai/gsm8k, subset: main, split: test, num_problems: 4, max_new_tokens: 64, batch_size: 4}
  deploy:
    - {name: h8, head: 8}
    - {name: e4, embed: 4}
    - {name: h8e4, head: 8, embed: 4}
  deploy_gguf_own: true

calibration:
  dataset: HuggingFaceFW/fineweb-edu
  subset: sample-10BT
  split: train
  num_sequences: 128
  context: 2048
  batch_size: 4

allocation:
  d: 4
  Ks: [256, 1024, 4096]
  fisher_sequences: 32     # 32 x 2,048 calibration tokens, as 64 x 1,024
  fisher_seq_len: 1024
  proxy_iters: 10
  proxy_fit_chunks: 250000

kmeans:
  iters: 25
  refit_iters: 10
  max_fit_chunks: 1000000
  assign_batch: 32768

runs:
  - {name: s14_30, method: stack, d: 4, K: 4096, G: 4, M: 1, rounds: 2, select_frac: 1.0, ldlq: true, ldlq_damp: 0.1, gsm8k: false, finetune: {steps: 512, seq_len: 1024, lr_books: 1.0e-4, lr_gain: 1.0e-3, log_every: 32}}
