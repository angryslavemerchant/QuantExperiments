# Stage 1: scalar baselines on the main model, run once each.
stage: 1
model: Qwen/Qwen2.5-1.5B-Instruct
reference_dtype: bfloat16
seed: 0
output_dir: artifacts/stage1_baselines

eval:
  logit_chunk: 512
  wikitext:
    dataset: Salesforce/wikitext
    subset: wikitext-2-raw-v1
    split: test
    context: 2048
    num_windows: 49        # 49 x 2,048 = ~100k tokens
  gsm8k:
    enabled: true
    dataset: openai/gsm8k
    subset: main
    split: test
    num_problems: 200
    max_new_tokens: 512
    batch_size: 50

kmeans:
  iters: 25
  max_fit_chunks: 1000000
  assign_batch: 65536

runs:
  - {name: original, method: original}
  - {name: q4_rtn, method: rtn, bits: 4, group: 32}
  - {name: q3_rtn, method: rtn, bits: 3, group: 32}
  - {name: q2_rtn, method: rtn, bits: 2, group: 32}
  - {name: ternary_rtn, method: ternary, group: 32}
