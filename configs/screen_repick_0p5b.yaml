# Local screen (RTX 2060): discrete code re-pick during fine-tune (PV-tuning-style V step, K-FAC
# curvature from sampled-token Fisher), alone and on LDLQ, on Qwen2.5-0.5B-Instruct. Baseline = the
# d8 screen's d4_k1024_g4_ft (KL 0.350); same eval/calibration/k-means settings.
# Run: python scripts/run_experiment.py --config configs/screen_repick_0p5b.yaml
stage: 11
output_dir: artifacts/prescreen/repick_0p5b
model: Qwen/Qwen2.5-0.5B-Instruct
reference_dtype: bfloat16
seed: 0
eval:
  logit_chunk: 256
  wikitext: {dataset: Salesforce/wikitext, subset: wikitext-2-raw-v1, split: test, context: 1024, num_windows: 24}
  gsm8k: {enabled: false, dataset: openai/gsm8k, subset: main, split: test, num_problems: 4, max_new_tokens: 64, batch_size: 4}
calibration: {dataset: HuggingFaceFW/fineweb-edu, subset: sample-10BT, split: train, num_sequences: 64, context: 1024, batch_size: 4}
allocation: {d: 4, Ks: [256, 1024, 4096], fisher_sequences: 8, fisher_seq_len: 1024, proxy_iters: 10, proxy_fit_chunks: 250000}
kmeans: {iters: 25, refit_iters: 10, max_fit_chunks: 1000000, assign_batch: 32768}
runs:
  - {name: original, method: original, gsm8k: false}
  - {name: g4, method: stack, d: 4, K: 1024, G: 4, M: 1, rounds: 2, gsm8k: false, finetune: {steps: 256, seq_len: 512, lr_books: 1.0e-4, lr_gain: 1.0e-3, log_every: 32}}
  - {name: g4_rp2, method: stack, d: 4, K: 1024, G: 4, M: 1, rounds: 2, gsm8k: false, finetune: {steps: 256, seq_len: 512, lr_books: 1.0e-4, lr_gain: 1.0e-3, log_every: 32, repick: {every: 64, accum: 8, frac: 0.02, damp: 0.1, etas: [0.1, 0.01, 0.001, 0.0001]}}}
  - {name: g4_rp05, method: stack, d: 4, K: 1024, G: 4, M: 1, rounds: 2, gsm8k: false, finetune: {steps: 256, seq_len: 512, lr_books: 1.0e-4, lr_gain: 1.0e-3, log_every: 32, repick: {every: 64, accum: 8, frac: 0.005, damp: 0.1, etas: [0.1, 0.01, 0.001, 0.0001]}}}
  - {name: g4_ldlq, method: stack, d: 4, K: 1024, G: 4, M: 1, rounds: 2, ldlq: true, gsm8k: false, finetune: {steps: 256, seq_len: 512, lr_books: 1.0e-4, lr_gain: 1.0e-3, log_every: 32}}
  - {name: g4_ldlq_rp2, method: stack, d: 4, K: 1024, G: 4, M: 1, rounds: 2, ldlq: true, gsm8k: false, finetune: {steps: 256, seq_len: 512, lr_books: 1.0e-4, lr_gain: 1.0e-3, log_every: 32, repick: {every: 64, accum: 8, frac: 0.02, damp: 0.1, etas: [0.1, 0.01, 0.001, 0.0001]}}}
